[package]
name = "markitdown-gui"
version = "0.1.0"
description = "Cross-platform desktop GUI for Microsoft's MarkItDown library"
authors = ["Your Name <you@example.com>"]
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/markitdown-gui"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This is due to Tauri requirements.
name = "markitdown_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

# Serialization — used for the JSON IPC protocol with the Python sidecar
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling — idiomatic Rust error propagation
thiserror = "1"

# Async runtime (Tauri uses Tokio under the hood)
tokio = { version = "1", features = ["full"] }

[profile.release]
# Optimization: smaller binary + better performance
panic = "abort"   # Removes panic unwinding code (~10% size reduction)
codegen-units = 1 # Better cross-function optimization (slower compile, faster runtime)
lto = true        # Link-time optimization
opt-level = "s"   # Optimize for size ("z" is more aggressive but can hurt perf)
strip = true      # Strip debug symbols from release binary
